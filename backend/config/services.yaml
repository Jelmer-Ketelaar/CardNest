# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(CART_RESERVATION_MINUTES): '15'
    env(TCGDEX_ARTIST_REQUEST_CONCURRENCY): '8'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Identity\Domain\Repository\UserRepository:
        alias: App\Identity\Infrastructure\Persistence\DoctrineUserRepository

    App\Identity\Domain\Repository\AuthTokenRepository:
        alias: App\Identity\Infrastructure\Persistence\DoctrineAuthTokenRepository

    App\Identity\Domain\Repository\EmailVerificationTokenRepository:
        alias: App\Identity\Infrastructure\Persistence\DoctrineEmailVerificationTokenRepository

    App\Identity\Domain\Repository\PasswordResetTokenRepository:
        alias: App\Identity\Infrastructure\Persistence\DoctrinePasswordResetTokenRepository

    App\Identity\Application\Email\EmailVerificationSender:
        alias: App\Identity\Infrastructure\Email\LoggingEmailVerificationSender

    App\Identity\Application\Email\PasswordResetSender:
        alias: App\Identity\Infrastructure\Email\LoggingPasswordResetSender

    App\Identity\Application\Security\LoginRateLimiter:
        arguments:
            $limiter: '@limiter.login'

    App\Identity\Application\Security\EmailVerificationRateLimiter:
        arguments:
            $limiter: '@limiter.email_verification'

    App\Identity\Application\Security\PasswordResetRateLimiter:
        arguments:
            $limiter: '@limiter.password_reset'

    App\Catalog\Domain\Repository\CardSetRepository:
        alias: App\Catalog\Infrastructure\Persistence\DoctrineCardSetRepository

    App\Catalog\Domain\Repository\CatalogCardRepository:
        alias: App\Catalog\Infrastructure\Persistence\DoctrineCatalogCardRepository

    App\Catalog\Domain\Repository\ArtistRepository:
        alias: App\Catalog\Infrastructure\Persistence\DoctrineArtistRepository

    App\Catalog\Domain\Provider\CardCatalogProvider:
        alias: App\Catalog\Infrastructure\Provider\TcgDexCardCatalogProvider

    App\Catalog\Domain\Provider\CatalogArtistProvider:
        alias: App\Catalog\Infrastructure\Provider\TcgDexCardCatalogProvider

    App\Catalog\Infrastructure\Provider\TcgDexCardCatalogProvider:
        arguments:
            $artistRequestConcurrency: '%env(int:TCGDEX_ARTIST_REQUEST_CONCURRENCY)%'

    App\Catalog\Application\Import\CatalogImportStore:
        alias: App\Catalog\Infrastructure\Import\DoctrineCatalogImportStore

    App\Catalog\Application\Import\CatalogArtistImportStore:
        alias: App\Catalog\Infrastructure\Import\DoctrineCatalogArtistImportStore

    App\Collection\Domain\Repository\CollectionItemRepository:
        alias: App\Collection\Infrastructure\Persistence\DoctrineCollectionItemRepository

    App\Collection\Domain\Repository\CollectionRepository:
        alias: App\Collection\Infrastructure\Persistence\DoctrineCollectionRepository

    App\Storage\Domain\Repository\StorageLocationRepository:
        alias: App\Storage\Infrastructure\Persistence\DoctrineStorageLocationRepository

    App\Storage\Domain\Repository\CollectionItemLocationRepository:
        alias: App\Storage\Infrastructure\Persistence\DoctrineCollectionItemLocationRepository

    App\Binder\Domain\Repository\BinderRepository:
        alias: App\Binder\Infrastructure\Persistence\DoctrineBinderRepository

    App\Wishlist\Domain\Repository\WishlistRepository:
        alias: App\Wishlist\Infrastructure\Persistence\DoctrineWishlistRepository

    App\Collection\Application\RegisteredCollectionItemsProcessor:
        alias: App\Wishlist\Application\MatchRegisteredCollectionItems

    App\Marketplace\Domain\Repository\ListingRepository:
        alias: App\Marketplace\Infrastructure\Persistence\DoctrineListingRepository

    App\Marketplace\Domain\Repository\ListingReservationRepository:
        alias: App\Marketplace\Infrastructure\Persistence\DoctrineListingReservationRepository

    App\Order\Domain\Repository\ShoppingCartRepository:
        alias: App\Order\Infrastructure\Persistence\DoctrineShoppingCartRepository

    App\Order\Domain\Repository\OrderRepository:
        alias: App\Order\Infrastructure\Persistence\DoctrineOrderRepository

    App\Payment\Domain\Repository\PaymentRepository:
        alias: App\Payment\Infrastructure\Persistence\DoctrinePaymentRepository

    App\Payment\Domain\Repository\RefundRepository:
        alias: App\Payment\Infrastructure\Persistence\DoctrineRefundRepository

    App\Payment\Domain\Provider\PaymentProvider:
        alias: App\Payment\Infrastructure\Provider\FakePaymentProvider

    App\Order\Application\CheckoutFaultInjector:
        alias: App\Order\Application\NullCheckoutFaultInjector

    App\Shipping\Domain\Repository\ShipmentRepository:
        alias: App\Shipping\Infrastructure\Persistence\DoctrineShipmentRepository

    App\Review\Domain\Repository\ReviewRepository:
        alias: App\Review\Infrastructure\Persistence\DoctrineReviewRepository

    App\Pricing\Domain\Repository\PriceSnapshotRepository:
        alias: App\Pricing\Infrastructure\Persistence\DoctrinePriceSnapshotRepository

    App\Pricing\Domain\Repository\TrackedPriceCardRepository:
        alias: App\Pricing\Infrastructure\Persistence\DoctrineTrackedPriceCardRepository

    App\Pricing\Domain\Provider\MarketPriceProvider:
        alias: App\Pricing\Infrastructure\Provider\TcgDexMarketPriceProvider

    App\Shared\Domain\Transaction\TransactionManager:
        alias: App\Shared\Infrastructure\Persistence\DoctrineTransactionManager

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        App\Payment\Domain\Provider\PaymentProvider:
            alias: App\Payment\Infrastructure\Provider\FakePaymentProvider
            public: true

        App\Order\Application\CheckoutFaultInjector:
            alias: App\Order\Application\NullCheckoutFaultInjector
            public: true
