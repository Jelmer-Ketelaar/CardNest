doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        mappings:
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain/Entity'
                prefix: 'App\Identity\Domain\Entity'
                alias: Identity
            Catalog:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Domain/Entity'
                prefix: 'App\Catalog\Domain\Entity'
                alias: Catalog
            Collection:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Collection/Domain/Entity'
                prefix: 'App\Collection\Domain\Entity'
                alias: Collection
            Storage:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Storage/Domain/Entity'
                prefix: 'App\Storage\Domain\Entity'
                alias: Storage
            Binder:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Binder/Domain/Entity'
                prefix: 'App\Binder\Domain\Entity'
                alias: Binder
            Wishlist:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Wishlist/Domain/Entity'
                prefix: 'App\Wishlist\Domain\Entity'
                alias: Wishlist
            Marketplace:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Marketplace/Domain/Entity'
                prefix: 'App\Marketplace\Domain\Entity'
                alias: Marketplace
            Order:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Order/Domain/Entity'
                prefix: 'App\Order\Domain\Entity'
                alias: Order
            Payment:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Payment/Domain/Entity'
                prefix: 'App\Payment\Domain\Entity'
                alias: Payment
            Shipping:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shipping/Domain/Entity'
                prefix: 'App\Shipping\Domain\Entity'
                alias: Shipping

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
