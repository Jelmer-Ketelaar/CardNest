services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    working_dir: /app
    command: >-
      sh -c "php bin/console doctrine:migrations:migrate --no-interaction
      && php -S 0.0.0.0:8000 -t public public/index.php"
    environment:
      APP_SECRET: ${APP_SECRET:-dev-secret-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgresql://cardnest:cardnest@postgres:5432/cardnest?serverVersion=16&charset=utf8}
      MESSENGER_TRANSPORT_DSN: ${REDIS_URL:-redis://redis:6379}/messages
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: /api/v1
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      - backend

  worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    working_dir: /app
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M --no-interaction
    environment:
      APP_SECRET: ${APP_SECRET:-dev-secret-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgresql://cardnest:cardnest@postgres:5432/cardnest?serverVersion=16&charset=utf8}
      MESSENGER_TRANSPORT_DSN: ${REDIS_URL:-redis://redis:6379}/messages
    volumes:
      - ./backend:/app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardnest}
      POSTGRES_USER: ${POSTGRES_USER:-cardnest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardnest}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  frontend_node_modules:
