name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cardnest_test
          POSTGRES_USER: cardnest
          POSTGRES_PASSWORD: cardnest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cardnest -d cardnest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      APP_SECRET: ci-secret
      DATABASE_URL: postgresql://cardnest:cardnest@127.0.0.1:5432/cardnest?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: in-memory://
      LOCK_DSN: flock
      CACHE_DSN: redis://127.0.0.1:6379/2
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, redis, zip
          coverage: none
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: php bin/console doctrine:migrations:migrate --no-interaction
      - run: php bin/phpunit
      - run: php bin/console cache:clear --env=dev
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff --allow-risky=yes

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
